server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50m;   # roof photos
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Docker DNS, resolved per request: nginx starts (and the app works) even when pgAdmin or the API is down
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_up api;
    set $pgadmin_up pgadmin;

    location /healthz { return 200 'ok'; add_header Content-Type text/plain; }

    # API + uploaded files + generated PDFs
    location /api/ {
        proxy_pass http://$api_up:8000;   # variable upstream keeps the original /api/... URI
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # PDF rendering / roof detection
    }

    # pgAdmin (database viewer/editor) — mounted under /pgadmin/
    location = /pgadmin { return 301 /pgadmin/; }
    location /pgadmin/ {
        proxy_pass http://$pgadmin_up:5050;   # keeps the original /pgadmin/... URI
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name /pgadmin;
        proxy_read_timeout 300s;
    }

    # hashed assets: cache forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }

    # SPA (hash router, but keep fallback)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
